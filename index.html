<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="style.css" class="style" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="#">Gmail</a>
        <a href="#">Images</a>

        <div class="app-icon">
          <span></span>
          <span></span>
          <span></span>

          <span></span>
          <span></span>
          <span></span>

          <span></span>
          <span></span>
          <span></span>
        </div>

        <button id="nav-btn">Sign in</button>
      </nav>
    </header>

    <main>
      <img src="./Assets/logo.png" alt="Google"/>

      <div class="search-bar">
        <div class="leftSearch-bar">
          <i class="ri-add-line"></i>
          <p>Ask Google</p>
        </div>

        <div class="rightSearch-bar">
          <i class="ri-mic-fill"></i>
          <i class="ri-camera-ai-2-line"></i>
          <button id="main-btn">AI Mode</button>
        </div>
      </div>

      <div class="hero-btn">
        <button id="leftHero-btn">
          <i class="ri-search-ai-line"></i>
          <div class="text">
            <h4>Do more with AI Mode</h4>
            <p>Create,summarize,plan</p>
          </div>
        </button>

        <button id="rightHero-btn">
          <i class="ri-image-circle-ai-line"></i>
          <div class="text">
            <h4>Create images</h4>
            <p>Reimagine, illustrate, edit</p>
          </div>
        </button>
      </div>
    </main>

    <footer></footer>
  </body>
</html>
